<div class="overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="lt">
    <div class="modal">
        <div class="hd">
            <h2 id="lt">Login</h2><button class="x" id="close" aria-label="Close">×</button>
        </div>
        <div class="bd">
            <div class="fld"><label class="l" for="lu">Username: <small>(Email)</small></label><input id="lu"
                    type="email" placeholder="user@gmail.com">
                <div class="err">Enter your registered email.</div>
            </div>
            <div class="fld" style="margin-bottom:4px"><label class="l" for="lp">Password:</label>
                <div class="pw"><input id="lp" type="password" placeholder="••••••••••••"><button type="button"
                        data-show="lp">Show</button></div>
                <div class="err">Enter your password.</div><a class="forgot" href="#login">I forgot my
                    username/password</a>
            </div>
            <p class="terms">By using this service, you understood and agree to the PUP Online Services <a
                    href="#login">Terms of Use</a> and <a href="#login">Privacy Statement</a>.</p>
        </div>
        <div class="ft"><a class="btn blue" href="#register">Register</a><button class="btn red" id="dologin"
                type="button">Login</button></div>
    </div>
</div>
